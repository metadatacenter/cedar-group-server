# Base OpenAPI document merged into the generated spec by io.swagger.core.v3:swagger-maven-plugin.
# It seeds the info block (version stamped from the POM via resource filtering) and the api_key
# security scheme that every resource class references with @SecurityRequirement(name = "api_key").
openapi: 3.0.1
info:
  title: CEDAR Group Server API
  description: |
    Better Metadata - Better Science

    The group server manages the groups CEDAR shares content with. A group is a name, a description,
    a set of members, and a set of administrators; permissions elsewhere in CEDAR are granted to groups
    as well as to individual users.
    
    Groups and their memberships use strong ETags. Read the group, or its members, and send the ETag
    back in If-Match when changing or deleting it: a missing precondition returns 428 and a stale one
    412. Only an administrator of a group may change it, and the built-in special groups cannot be
    changed at all.
  version: ${project.version}
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: Authorization
      in: header
      description: "Your CEDAR API key, using the format 'apiKey <yourApiKey>'"

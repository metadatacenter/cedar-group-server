# Base OpenAPI document merged into the generated spec by io.swagger.core.v3:swagger-maven-plugin.
# It seeds the info block (version stamped from the POM via resource filtering) and the api_key
# security scheme that every resource class references with @SecurityRequirement(name = "api_key").
openapi: 3.0.1
info:
  title: CEDAR Group Server API
  description: |
    Better Metadata - Better Science

    The group server manages the groups CEDAR shares content with. A group is a name, a description,
    a set of members, and a set of administrators; permissions elsewhere in CEDAR are granted to groups
    as well as to individual users.
    
    Groups and their memberships use strong ETags. Read the group, or its members, and send the ETag
    back in If-Match when changing or deleting it: a missing precondition returns 428 and a stale one
    412. Only an administrator of a group may change it, and the built-in special groups cannot be
    changed at all.
  version: ${project.version}
components:
  schemas:
    GroupWriteRequest:
      type: object
      description: A complete group name and description used for creation or replacement.
      required:
        - 'schema:name'
        - 'schema:description'
      properties:
        'schema:name':
          type: string
        'schema:description':
          type: string
      additionalProperties: true
    GroupPatchRequest:
      type: object
      description: A JSON merge patch for the mutable group properties.
      minProperties: 1
      properties:
        'schema:name':
          type: string
          description: Renames the group; null is refused because a group must have a name.
        'schema:description':
          type: string
          nullable: true
          description: Null removes the description.
      additionalProperties: true
    GroupMemberUser:
      type: object
      required:
        - '@id'
      properties:
        '@id':
          type: string
          format: uri
        firstName:
          type: string
          readOnly: true
        lastName:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
      additionalProperties: true
    GroupMember:
      type: object
      required:
        - user
        - administrator
        - member
      properties:
        user:
          $ref: '#/components/schemas/GroupMemberUser'
        administrator:
          type: boolean
        member:
          type: boolean
      additionalProperties: true
    GroupMembership:
      type: object
      required:
        - users
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/GroupMember'
      additionalProperties: false
    Group:
      type: object
      required:
        - '@id'
        - resourceType
        - 'schema:name'
      properties:
        '@id':
          type: string
          format: uri
        resourceType:
          type: string
          enum: [group]
        'schema:name':
          type: string
        'schema:description':
          type: string
          nullable: true
        'schema:identifier':
          type: string
          nullable: true
        'pav:createdOn':
          type: string
          format: date-time
        'pav:lastUpdatedOn':
          type: string
          format: date-time
        createdOnTS:
          type: integer
          format: int64
        lastUpdatedOnTS:
          type: integer
          format: int64
        specialGroup:
          type: string
          nullable: true
        'pav:createdBy':
          type: string
          format: uri
        'oslc:modifiedBy':
          type: string
          format: uri
        sourceHash:
          type: string
          nullable: true
        '@context':
          type: object
          readOnly: true
          additionalProperties:
            type: string
      additionalProperties: false
    GroupList:
      type: object
      required:
        - groups
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Group'
      additionalProperties: false
  securitySchemes:
    api_key:
      type: apiKey
      name: Authorization
      in: header
      description: "Your CEDAR API key, using the format 'apiKey <yourApiKey>'"

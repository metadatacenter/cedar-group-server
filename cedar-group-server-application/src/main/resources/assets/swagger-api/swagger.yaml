openapi: 3.0.1
info:
  description: |
    Better Metadata - Better Science

    The group server manages the groups CEDAR shares content with. A group is a name, a description,
    a set of members, and a set of administrators; permissions elsewhere in CEDAR are granted to groups
    as well as to individual users.

    Groups and their memberships use strong ETags. Read the group, or its members, and send the ETag
    back in If-Match when changing or deleting it: a missing precondition returns 428 and a stale one
    412. Only an administrator of a group may change it, and the built-in special groups cannot be
    changed at all.
  title: CEDAR Group Server API
  version: 2.9.9-SNAPSHOT
paths:
  /groups:
    get:
      description: Return every group in the system. Groups are visible to anyone
        who may read them; membership is not what decides whether a group is listed.
      operationId: findGroups
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupList"
          description: Every group
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the group read permission
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: List all groups
      tags:
      - Groups
    post:
      description: "Create a group from a name and a description. Names are unique,\
        \ so a name already in use is refused rather than resolved."
      operationId: createGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupWriteRequest"
        description: The new group's name and description
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
          description: The group as created
          headers:
            ETag:
              description: Strong validator for the group's current revision.
              schema:
                type: string
              style: simple
            Location:
              description: URL of the new group.
              schema:
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The name or the description is missing
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the group create permission
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: A group of that name already exists
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Create a group
      tags:
      - Groups
  /groups/{id}:
    delete:
      description: Remove a group. Only an administrator of the group may change it.
        The group-update permission every user holds does not gate this on its own.
        The built-in special groups cannot be deleted.
      operationId: deleteGroup
      parameters:
      - description: "The group's current ETag, as returned by GET. A write without\
          \ it is refused with 428, and a stale one with 412, so a change can not\
          \ silently overwrite one that landed since the group was read."
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      - description: Group identifier.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Deleted
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The group is a special group
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller does not administer this group
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: No such group
        "412":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: "The If-Match value is stale, or the group has since been deleted"
        "428":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Deleting a group requires its current ETag in If-Match
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Delete a group
      tags:
      - Groups
    get:
      description: Return one group. The ETag it carries is what a later update or
        delete must supply in If-Match.
      operationId: findGroup
      parameters:
      - description: Group identifier.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
          description: The group
          headers:
            ETag:
              description: Strong validator for the group's current revision.
              schema:
                type: string
              style: simple
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the group read permission
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: No such group
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Get a group
      tags:
      - Groups
    patch:
      description: "Change a group's name or description with a JSON merge patch,\
        \ leaving anything the patch does not mention alone. Only an administrator\
        \ of the group may change it. The group-update permission every user holds\
        \ does not gate this on its own. The built-in special groups cannot be changed."
      operationId: patchGroup
      parameters:
      - description: "The group's current ETag, as returned by GET. A write without\
          \ it is refused with 428, and a stale one with 412, so a change can not\
          \ silently overwrite one that landed since the group was read."
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      - description: Group identifier.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/GroupPatchRequest"
        description: The group properties to replace or remove
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
          description: The group as patched
          headers:
            ETag:
              description: Strong validator for the group's current revision.
              schema:
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: "The patch is not well formed, or the group is a special group"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller does not administer this group
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: No such group
        "412":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: "The If-Match value is stale, or the group has since been deleted"
        "428":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Patching a group requires its current ETag in If-Match
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Change part of a group
      tags:
      - Groups
    put:
      description: Change a group's name or description. Only an administrator of
        the group may change it. The group-update permission every user holds does
        not gate this on its own. The built-in special groups cannot be changed at
        all.
      operationId: updateGroup
      parameters:
      - description: "The group's current ETag, as returned by GET. A write without\
          \ it is refused with 428, and a stale one with 412, so a change can not\
          \ silently overwrite one that landed since the group was read."
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      - description: Group identifier.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupWriteRequest"
        description: The replacement name and description
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
          description: The group as updated
          headers:
            ETag:
              description: Strong validator for the group's current revision.
              schema:
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: "Nothing to change, or the group is a special group"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller does not administer this group
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: No such group
        "412":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: "The If-Match value is stale, or the group has since been deleted"
        "428":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Updating a group requires its current ETag in If-Match
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Rename a group
      tags:
      - Groups
  /groups/{id}/users:
    get:
      description: "Return the group's members and its administrators. The ETag is\
        \ over the membership, so it is what a membership update must supply, not\
        \ the group's own."
      operationId: getGroupMembers
      parameters:
      - description: Group identifier.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMembership"
          description: The group's members and administrators
          headers:
            ETag:
              description: '"Strong validator for the membership''s current revision."'
              schema:
                type: string
              style: simple
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the group read permission
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: No such group
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: List a group's members
      tags:
      - Groups
    put:
      description: Set who belongs to the group and who administers it. This replaces
        the membership rather than adding to it. Only an administrator of the group
        may change it. The group-update permission every user holds does not gate
        this on its own. The built-in special groups cannot be changed.
      operationId: updateGroupMembers
      parameters:
      - description: "The membership's current ETag, as returned by the members listing.\
          \ A write without it is refused with 428, and a stale one with 412."
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      - description: Group identifier.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupMembership"
        description: The complete replacement membership
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMembership"
          description: The membership as updated
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: "The membership in the body is not well formed, or the group\
            \ is a special group"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller does not administer this group
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: No such group
        "412":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: "The If-Match value is stale, or the group has since been deleted"
        "428":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Changing a membership requires its current ETag in If-Match
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Replace a group's members
      tags:
      - Groups
components:
  schemas:
    CedarError:
      type: object
      additionalProperties: true
      description: A CEDAR error response. Diagnostic fields are populated only when
        they are relevant to the failure.
      properties:
        entities:
          type: object
          additionalProperties:
            type: object
            description: Named domain entities associated with exception-mapped errors.
            nullable: true
          description: Named domain entities associated with exception-mapped errors.
          nullable: true
        errorId:
          type: string
          format: uuid
          description: Correlation identifier for an internal error recorded in server
            logs.
          nullable: true
        errorKey:
          type: string
          description: Stable machine-readable error identifier.
          enum:
          - templateElementNotCreated
          - templateElementNotFound
          - templateElementNotDeleted
          - templateElementNotUpdated
          - templateElementsNotListed
          - templateFieldNotCreated
          - templateFieldNotFound
          - templateFieldNotDeleted
          - templateFieldNotUpdated
          - templateFieldsNotListed
          - templateNotCreated
          - templateNotFound
          - templateNotDeleted
          - templateNotUpdated
          - templatesNotListed
          - templateInstanceNotCreated
          - templateInstanceNotFound
          - templateInstanceNotDeleted
          - templateInstanceNotUpdated
          - templateInstancesNotListed
          - noReadAccessToResource
          - noWriteAccessToResource
          - noReadAccessToFolder
          - noWriteAccessToFolder
          - noReadAccessToTemplate
          - noWriteAccessToTemplate
          - noReadAccessToTemplateElement
          - noWriteAccessToTemplateElement
          - noReadAccessToTemplateField
          - noWriteAccessToTemplateField
          - noReadAccessToTemplateInstance
          - noWriteAccessToTemplateInstance
          - noReadAccessToArtifact
          - noWriteAccessToArtifact
          - noWriteAccessToCategory
          - folderNotFound
          - artifactNotFound
          - artifactPreconditionRequired
          - artifactHasMovedOn
          - verbatimWriteRefused
          - nodeNotFound
          - unknownResourceType
          - missingParameter
          - invalidInput
          - sourceFolderNotFound
          - sourceResourceNotFound
          - targetFolderNotFound
          - nodeNotMoved
          - groupNotFound
          - userNotFound
          - uniqueConstraintCollision
          - invalidData
          - notAuthorized
          - permissionMissing
          - tokenInvalid
          - userInfoLoadByTokenFailed
          - userInfoLoadByApiKeyFailed
          - cedarUserNotFound
          - authorizationNotFound
          - permissionNotOwned
          - authorizationTypeUnknown
          - apiKeyNotFound
          - tokenMissing
          - tokenExpired
          - parentFolderNotSpecified
          - parentFolderSpecifiedTwice
          - pathNotNormalized
          - parentFolderNotFound
          - updateInvalidFolderName
          - createInvalidFolderName
          - nodeAlreadyPresent
          - folderNotCreated
          - missingNameAndDescription
          - missingData
          - folderNotDeleted
          - artifactNotDeleted
          - resourceNotCreated
          - invalidResourceType
          - invalidArtifactType
          - readOtherProfileForbidden
          - updateOtherProfileForbidden
          - folderCanNotBeDeleted
          - folderCanNotBeChanged
          - groupAlreadyPresent
          - groupCanBeModifiedOnlyByGroupAdmin
          - groupCanBeDeletedOnlyByGroupAdmin
          - groupUsersNotUpdated
          - specialGroupCanNotBeDeleted
          - folderPermissionsCanNotBeChanged
          - unknownInstanceOutputFormat
          - folderCopyNotAllowed
          - methodNotImplemented
          - upstreamServerError
          - nothingToDo
          - parentCategoryNotFound
          - categoryAlreadyPresent
          - categoryNotFound
          - categoryCanNotBeDeleted
          - rootCategoryCanNotBeDeleted
          - unableToAttachCategory
          - unableToDetachCategory
          - noCategoriesWereAttached
          - malformedJsonRequestBody
          - malformedSearchTerm
          - publishedArtifactCanNotBeChanged
          - publishedArtifactCanNotBeDeleted
          - versioningOnlyOnLatest
          - versioningOnlyByOwner
          - nonVersionedArtifactType
          - createDraftOnlyFromPublished
          - publishOnlyDraft
          - draftNotCreated
          - contentNotValid
          - doiNotSupportedByResourceType
          - doiCanNotBeSetForEmptyAtId
          - doiCanNotBeAltered
          - doiCanNotBeSet
          - doiAlreadyExists
          - dataCiteDOIDisabled
          - resourceNotFound
          - internalError
          nullable: true
        errorMessage:
          type: string
          description: Alias of message retained for compatibility.
          nullable: true
        errorReasonKey:
          type: string
          description: More specific machine-readable reason for the error.
          enum:
          - nonEmptyFolder
          - nonEmptyCategory
          - userHomeFolder
          - systemFolder
          - templateReferencedInInstances
          - validationError
          - continuationExpired
          nullable: true
        errorType:
          type: string
          description: Broad category of the error.
          enum:
          - notFound
          - invalidArgument
          - authorization
          - permission
          - server
          - validationError
          nullable: true
        message:
          type: string
          description: Human-readable error message.
          nullable: true
        objects:
          type: object
          additionalProperties:
            type: object
            description: Named structured values associated with the error.
          description: Named structured values associated with the error.
        operation:
          type: object
          additionalProperties:
            type: object
            description: Operation that failed. Its fields depend on the operation
              type.
            nullable: true
          description: Operation that failed. Its fields depend on the operation type.
          nullable: true
        parameters:
          type: object
          additionalProperties:
            type: object
            description: Named scalar values associated with the error.
          description: Named scalar values associated with the error.
        status:
          type: string
          description: Symbolic HTTP response status.
          enum:
          - BAD_REQUEST
          - UNAUTHORIZED
          - FORBIDDEN
          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - NOT_ACCEPTABLE
          - CONFLICT
          - PRECONDITION_FAILED
          - UNSUPPORTED_MEDIA_TYPE
          - UNPROCESSABLE_ENTITY
          - PRECONDITION_REQUIRED
          - INTERNAL_SERVER_ERROR
          - NOT_IMPLEMENTED
          - BAD_GATEWAY
          - SERVICE_UNAVAILABLE
          - HTTP_VERSION_NOT_SUPPORTED
        statusCode:
          type: integer
          format: int32
          description: Numeric HTTP response status.
          maximum: 599
          minimum: 400
        suggestedAction:
          type: string
          description: Recovery action suggested to the client.
          enum:
          - none
          - requestRole
          - logout
          - logoutImmediately
          - provideAuthorizationHeader
          - refreshToken
          nullable: true
      required:
      - status
      - statusCode
    Group:
      type: object
      additionalProperties: false
      properties:
        '@context':
          type: object
          additionalProperties:
            type: string
          readOnly: true
        '@id':
          type: string
          format: uri
        createdOnTS:
          type: integer
          format: int64
        lastUpdatedOnTS:
          type: integer
          format: int64
        oslc:modifiedBy:
          type: string
          format: uri
        pav:createdBy:
          type: string
          format: uri
        pav:createdOn:
          type: string
          format: date-time
        pav:lastUpdatedOn:
          type: string
          format: date-time
        resourceType:
          type: string
          enum:
          - group
        schema:description:
          type: string
          nullable: true
        schema:identifier:
          type: string
          nullable: true
        schema:name:
          type: string
        sourceHash:
          type: string
          nullable: true
        specialGroup:
          type: string
          nullable: true
      required:
      - '@id'
      - resourceType
      - schema:name
    GroupList:
      type: object
      additionalProperties: false
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/Group"
      required:
      - groups
    GroupMember:
      type: object
      additionalProperties: true
      properties:
        administrator:
          type: boolean
        member:
          type: boolean
        user:
          $ref: "#/components/schemas/GroupMemberUser"
      required:
      - administrator
      - member
      - user
    GroupMemberUser:
      type: object
      additionalProperties: true
      properties:
        '@id':
          type: string
          format: uri
        email:
          type: string
          format: email
          readOnly: true
        firstName:
          type: string
          readOnly: true
        lastName:
          type: string
          readOnly: true
      required:
      - '@id'
    GroupMembership:
      type: object
      additionalProperties: false
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/GroupMember"
      required:
      - users
    GroupPatchRequest:
      type: object
      additionalProperties: true
      description: A JSON merge patch for the mutable group properties.
      minProperties: 1
      properties:
        schema:description:
          type: string
          description: Null removes the description.
          nullable: true
        schema:name:
          type: string
          description: Renames the group; null is refused because a group must have
            a name.
    GroupWriteRequest:
      type: object
      additionalProperties: true
      description: A complete group name and description used for creation or replacement.
      properties:
        schema:description:
          type: string
        schema:name:
          type: string
      required:
      - schema:description
      - schema:name
  securitySchemes:
    api_key:
      description: "Your CEDAR API key, using the format 'apiKey <yourApiKey>'"
      in: header
      name: Authorization
      type: apiKey
